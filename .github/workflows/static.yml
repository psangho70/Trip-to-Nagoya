# GitHub Pages 정적 웹페이지 자동 배포 워크플로우 (Static HTML)
name: Deploy static content to Pages

on:
  # main 브랜치에 푸시될 때마다 자동 배포 실행
  push:
    branches: ["main"]

  # Actions 탭에서 수동으로도 실행 가능하도록 설정
  workflow_dispatch:

# GITHUB_TOKEN 권한 설정 (GitHub Pages 배포용)
permissions:
  contents: read
  pages: write
  id-token: write

# 동시 배포 제어 (진행 중인 배포는 취소하지 않고 대기)
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 단일 배포 작업 정의 (빌드 과정 없이 정적 파일 그대로 배포)
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 저장소 루트('.') 전체 업로드
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
